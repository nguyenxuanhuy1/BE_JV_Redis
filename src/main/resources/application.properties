spring.application.name=nxh-base

# ===== PostgreSQL =====
spring.datasource.username=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/dbbase
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/dbbase
spring.datasource.password=thanghuy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Redis Cluster (3 master + 3 replica) =====
spring.data.redis.cluster.nodes=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
spring.data.redis.cluster.max-redirects=3
spring.cache.type=redis
# none t?t redis
# spring.cache.type=none
logging.level.org.springframework.cache=DEBUG

